server.port=5000
server.error.include-message=always

# Default: file database, zero setup (data saved in ./data)
spring.datasource.url=jdbc:h2:file:./data/skillify;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# To use MySQL instead, replace the 3 lines above with:
# spring.datasource.url=jdbc:mysql://localhost:3306/skillify?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=update

# Google key (Gemini AI). Set GOOGLE_API_KEY as an environment variable.
ai.key=${GOOGLE_API_KEY:}
# Model name: if Google retires it, pick a current one in Google AI Studio and change it here
ai.model=gemini-flash-latest
# YouTube uses its own key if set, otherwise the same Google key
# (that key's Google project must have "YouTube Data API v3" enabled)
youtube.key=${YOUTUBE_API_KEY:${GOOGLE_API_KEY:}}

# Only needed if you open the frontend from another address (e.g. VS Code Live Server)
cors.origins=http://localhost:5500,http://127.0.0.1:5500
